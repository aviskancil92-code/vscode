name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Runner ubuntu-latest sudah membawa Android SDK (ANDROID_HOME);
      # cukup pastikan lisensi + platform/build-tools yang dibutuhkan ada.
      - name: Siapkan Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Bersihkan berkas lama yang sudah tidak dipakai
        run: rm -f app/src/main/res/drawable/bg_logo.xml app/src/main/res/drawable/ic_launcher_fg.xml app/src/main/res/menu/menu_main.xml
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-mobile-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
